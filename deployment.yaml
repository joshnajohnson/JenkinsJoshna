apiVersion: apps/v1
kind: Deployment
metadata:
name: jenkinsjoshna
spec:
replicas: 2
selector:
matchLabels:
app: jenkinsjoshna
template:
metadata:
labels:
app: jenkinsjoshna
spec:
containers:
- name: jenkinsjoshna
image: joshnajohnson/jenkinsjoshna:latest
ports:
- containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
name: jenkinsjoshna-service
spec:
type: NodePort
selector:
app: jenkinsjoshna
ports:
- port: 
targetPort: 80
nodePort: 30010